[build-system]
requires = ["setuptools==80.3.1"]
build-backend = "setuptools.build_meta"

[project]
name = "opspilot"
version = "1.0.0"
description = "Evidence-driven MLOps operations with DVC, MLflow, Airflow and Kubernetes"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.2", "httpx==0.28.1",
  "pydantic-settings==2.9.1", "mlflow==2.22.0", "dvc==3.59.2",
  "kubernetes==32.0.1", "scikit-learn==1.6.1", "pandas==2.2.3", "PyYAML==6.0.2",
  "pathspec==0.12.1",
  "SQLAlchemy==2.0.40", "numpy==2.2.5", "scipy==1.15.2",
  "pydantic==2.11.4", "joblib==1.5.0",
]
[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.9"]
[tool.setuptools.packages.find]
include = ["agent*", "api*", "training*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
